<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おもちゃ楽器 リズム譜メーカー</title>
<style>
:root{
  --bg:#fff8ec; --card:#fff; --ink:#2b2f36; --sub:#6b7280; --line:#eadfcd;
  --tp:#f39c12; --xy:#e8413c;
  --font:"Noto Sans JP","Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font)}
main{max-width:960px;margin:0 auto;padding-block:max(40px,env(safe-area-inset-top,0px)) 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}
header{text-align:center;display:flex;flex-direction:column;gap:8px}
header small{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.12em}
h1{margin:0;font-size:clamp(26px,5vw,38px);font-weight:900;letter-spacing:.04em;text-wrap:balance}
header p{margin:0;font-size:14px;color:var(--sub);line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px;
  text-decoration:none;color:inherit;box-shadow:0 8px 0 var(--line);transition:transform .08s, box-shadow .08s}
.card:hover{transform:translateY(-3px);box-shadow:0 11px 0 var(--line)}
.card:active{transform:translateY(5px);box-shadow:0 3px 0 var(--line)}
.card:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.pic{height:170px;display:flex;align-items:center;justify-content:center}
.pic img{max-height:100%;max-width:100%;object-fit:contain;mix-blend-mode:multiply}
.card h2{margin:0;font-size:24px;font-weight:900}
.notes{display:flex;gap:6px;flex-wrap:wrap}
.notes i{font-style:normal;font-weight:900;font-size:13px;min-width:30px;height:30px;padding:0 6px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.card p{margin:0;font-size:13px;color:var(--sub);line-height:1.7}
.go{margin-top:auto;align-self:stretch;text-align:center;font-weight:900;font-size:16px;color:#fff;border-radius:12px;padding:12px}
.tp .go{background:var(--tp)} .xy .go{background:var(--xy)}
footer{text-align:center;font-size:12px;color:var(--sub);line-height:1.7}
</style>
</head>
<body>
<main>
  <header>
    <small>楽器をえらんでください</small>
    <h1>おもちゃ楽器 リズム譜メーカー</h1>
